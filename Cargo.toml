[workspace]
resolver = "2"
members = ["crates/attacca-core", "crates/attacca-cli", "crates/attacca-ui"]
exclude = ["vendor"]

# Queue support (subscribe_queue/play_from_here) is not in the upstream
# release; see vendor/roon-api/VENDORED.md.
[patch.crates-io]
roon-api = { path = "vendor/roon-api" }

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/styx-techno/attacca"

[workspace.dependencies]
roon-api = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs-next = "2"
