[package]
name = "attacca-ui"
description = "Qt 6 / QML desktop UI for Attacca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "attacca"
path = "src/main.rs"

[dependencies]
attacca-core = { path = "../attacca-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
dirs-next = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["full"] }
roon-sood = "0.5"
# Same version and features as the vendored roon-api crate, so this adds no
# new packages to the lockfile (keeps the Flatpak cargo-sources.json stable).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
mpris-server = "0.10.0"

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
