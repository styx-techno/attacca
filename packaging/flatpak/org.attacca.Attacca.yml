# Flatpak manifest for Attacca.
#
# cargo-sources.json is generated, not hand-written. Regenerate it whenever
# Cargo.lock changes, or the offline build will fail on a missing crate:
#
#   pip install tomlkit aiohttp PyYAML
#   curl -O https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py ../../Cargo.lock -o cargo-sources.json
#
# Build and install locally with:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-dir org.attacca.Attacca.yml
app-id: org.attacca.Attacca
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  # Must match the freedesktop base of org.kde.Sdk//6.11.
  - org.freedesktop.Sdk.Extension.rust-stable
command: attacca

finish-args:
  # Roon Core discovery is SOOD over UDP multicast, then MOO over a WebSocket,
  # plus plain HTTP for artwork — all on the local network.
  - --share=network
  # GPU-rendered QML
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  # MPRIS2: media keys, desktop widgets, and the single-instance check that
  # raises a running window instead of starting a rival (two instances share
  # one Roon extension identity, and the Core resets connections when the same
  # identity connects twice).
  #
  # Do not also add --talk-name for this bus name: flatpak keeps one policy
  # level per name and the later flag wins, so it silently downgrades own to
  # talk and MPRIS registration then fails with AccessDenied. own implies talk.
  - --own-name=org.mpris.MediaPlayer2.attacca

modules:
  - name: attacca
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/attacca/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release -p attacca-ui -p attacca-cli
      - install -Dm755 target/release/attacca /app/bin/attacca
      - install -Dm755 target/release/attacca-cli /app/bin/attacca-cli
      # Flatpak looks the icon up by app-id, so the desktop entry must point at
      # the renamed file rather than the plain "attacca" used off-Flatpak.
      - install -Dm644 packaging/attacca.desktop
        /app/share/applications/org.attacca.Attacca.desktop
      # The app sets its Wayland app_id from FLATPAK_ID, so both the icon and
      # the window-matching hint follow the app-id rather than the plain
      # "attacca" used off-Flatpak.
      - desktop-file-edit --set-icon=org.attacca.Attacca
        --set-key=StartupWMClass --set-value=org.attacca.Attacca
        /app/share/applications/org.attacca.Attacca.desktop
      - install -Dm644 packaging/attacca.svg
        /app/share/icons/hicolor/scalable/apps/org.attacca.Attacca.svg
      - install -Dm644 packaging/flatpak/org.attacca.Attacca.metainfo.xml
        /app/share/metainfo/org.attacca.Attacca.metainfo.xml
    sources:
      # Flathub requires a fixed revision, not a moving branch. Bump both the
      # tag and the commit together on each release.
      - type: git
        url: https://github.com/styx-techno/attacca.git
        tag: v0.0.1
        commit: 45b2e3b794c8d9b84eedd740ba002f1174e1385d
      - cargo-sources.json
